name: Build OpenSSL Packages

on:
  workflow_dispatch:

jobs:
  build-openssl:
    name: Build OpenSSL package for (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build OpenSSL packages
        env:
          npm_config_arch: ${{ matrix.arch }}
          NODEGIT_OPENSSL_BUILD_PACKAGE: 1
          OPENSSL_MACOS_DEPLOYMENT_TARGET: "11.0"
        run: node utils/acquireOpenSSL.mjs

      - name: Upload OpenSSL packages
        uses: actions/upload-artifact@v4
        with:
          name: openssl-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            utils/openssl-*.tar.gz
            utils/openssl-*.tar.gz.sha256
          if-no-files-found: error
