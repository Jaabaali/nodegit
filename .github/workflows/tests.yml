on:
  push:
    branches:
      - main
      - backport/*
  pull_request:

name: Testing

jobs:
  linux-tests:
    name: "Linux Tests"
    strategy:
      matrix:
        node: [24, 26]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies for Ubuntu
        run: sudo apt-get update && sudo apt-get install -y software-properties-common git build-essential clang libssl-dev libkrb5-dev libc++-dev wget zlib1g-dev

      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          set -e
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          cat test/id_rsa.pub > ~/.ssh_tests/id_rsa.pub
          cat test/id_rsa.enc | base64 -d > ~/.ssh_tests/id_rsa
          chmod 600 ~/.ssh_tests/id_rsa*
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        run: npm install

      - name: Test
        run: |
          set -e
          eval `ssh-agent -s`
          ssh-add ~/.ssh_tests/id_rsa
          node utils/retry npm test

      - name: Prebuild
        if: github.ref == 'refs/heads/main'
        run: npm run prebuild

      - name: Upload Prebuild Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-linux-${{ matrix.node }}-x64
          path: prebuilds/

  macos-tests:
    name: "macOS Tests"
    strategy:
      matrix:
        node: [24, 26]
        arch: [arm64]
      fail-fast: false
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          cat test/id_rsa.pub > ~/.ssh_tests/id_rsa.pub
          cat test/id_rsa.enc | base64 -d > ~/.ssh_tests/id_rsa
          chmod 600 ~/.ssh_tests/id_rsa*
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        run: npm install

      - name: Test
        run: |
          set -e
          eval `ssh-agent -s`
          ssh-add ~/.ssh_tests/id_rsa
          node utils/retry npm test

      - name: Prebuild
        if: github.ref == 'refs/heads/main'
        run: npm run prebuild

      - name: Upload Prebuild Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-macos-${{ matrix.node }}-${{ matrix.arch }}
          path: prebuilds/

  windows-tests:
    name: Windows Tests
    strategy:
      matrix:
        node: [24, 26]
        arch: [x64, arm64]
      fail-fast: false
    runs-on: windows-latest
    steps:
      - name: Setup Environment
        run: |
          git config --file C:\ProgramData\Git\config core.autocrlf input
          git config --system core.autocrlf input
          git config --global core.autocrlf input
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: npm install

      - name: Test
        # need arm64 runners or an emulator to run tests
        if: matrix.arch != 'arm64'
        env:
          GIT_SSH: ${{ github.workspace }}\vendor\plink.exe
        run: |
          $encodedKey = Get-Content -Path test\private.ppk.enc
          $finalPath = Join-Path -Path $HOME -ChildPath .ssh_tests\private.ppk
          mkdir ~\.ssh_tests
          Set-Content -Value $([System.Convert]::FromBase64String($encodedKey)) -Path $finalPath -AsByteStream
          powershell -command "Start-Process .\vendor\pageant\pageant_${{ matrix.arch }}.exe $finalPath"
          node utils/retry npm test

      # You're probably wondering why this isn't a single `run: |` step, it certainly is for *nix,
      # but it's not, because the CI runner for windows doesn't wait for each step as listed here
      # and it treats each additional step past the first as an orphaned process.
      - name: Prebuild
        if: github.ref == 'refs/heads/main'
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: npm run prebuild

      - name: Upload Prebuild Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-windows-${{ matrix.node }}-${{ matrix.arch }}
          path: prebuilds/

  publish:
    name: "Publish to GCP Artifact Registry"
    needs: [linux-tests, macos-tests, windows-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write" # Required for GCP Workload Identity

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: prebuilds/
          pattern: prebuilds-*
          merge-multiple: true

      - name: Verify prebuilds structure
        run: |
          echo "Listing prebuilds directory structure:"
          ls -R prebuilds/ || echo "No prebuilds found"

      # 1. Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/474483455540/locations/global/workloadIdentityPools/github-infra-repository/providers/github"
          service_account: "github-actions-sa@jabali-infra.iam.gserviceaccount.com"
          token_format: "access_token"

      # 2. Configure NPM to use the GCP Token
      - name: Configure NPM Auth
        run: |
          REGISTRY_URL="https://us-east4-npm.pkg.dev/jabali-infra/npm-infra/"
          REGISTRY_NO_PROTO=${REGISTRY_URL#http*:}

          echo "@jabali:registry=${REGISTRY_URL}" > .npmrc
          echo "${REGISTRY_NO_PROTO}:_authToken=${{ steps.auth.outputs.access_token }}" >> .npmrc
          echo "${REGISTRY_NO_PROTO}:always-auth=true" >> .npmrc

      # 3. Publish
      - name: Publish to GCP Artifact Registry
        run: npm publish --access public --tag jabali
        env:
          NODE_AUTH_TOKEN: ${{ steps.auth.outputs.access_token }}

  bump-jabali-prerelease:
    name: Bump jabali prerelease
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/bump-jabali-prerelease.yml
