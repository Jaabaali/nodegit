on:
  push:
    branches:
      - main
      - backport/*
  pull_request:

name: Testing

jobs:
  linux-tests:
    name: "Linux Tests"
    strategy:
      matrix:
        node: [24, 26]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies for Ubuntu
        run: sudo apt-get update && sudo apt-get install -y software-properties-common git build-essential clang libssl-dev libkrb5-dev libc++-dev wget zlib1g-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Environment
        run: |
          set -e
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          cat test/id_rsa.pub > ~/.ssh_tests/id_rsa.pub
          cat test/id_rsa.enc | base64 -d > ~/.ssh_tests/id_rsa
          chmod 600 ~/.ssh_tests/id_rsa*
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        run: npm ci

      - name: Test
        run: |
          set -e
          eval `ssh-agent -s`
          ssh-add ~/.ssh_tests/id_rsa
          node utils/retry npm test

      - name: Test packed installation
        run: npm run test:package

      - name: Prebuild
        run: npm run prebuild

      - name: Test Electron runtimes
        if: matrix.node == 24
        run: npm run test:electron

      - name: Upload Prebuild Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-linux-${{ matrix.node }}-x64
          path: prebuilds/

  macos-tests:
    name: "macOS Tests"
    strategy:
      matrix:
        node: [24, 26]
        arch: [arm64]
      fail-fast: false
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Environment
        run: |
          mkdir ~/.ssh_tests
          chmod 700 ~/.ssh_tests
          printf "%b" "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh_tests/config
          cat test/id_rsa.pub > ~/.ssh_tests/id_rsa.pub
          cat test/id_rsa.enc | base64 -d > ~/.ssh_tests/id_rsa
          chmod 600 ~/.ssh_tests/id_rsa*
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        run: npm ci

      - name: Test
        run: |
          set -e
          eval `ssh-agent -s`
          ssh-add ~/.ssh_tests/id_rsa
          node utils/retry npm test

      - name: Test packed installation
        run: npm run test:package

      - name: Prebuild
        run: npm run prebuild

      - name: Test Electron runtimes
        if: matrix.node == 24
        run: npm run test:electron

      - name: Upload Prebuild Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-macos-${{ matrix.node }}-${{ matrix.arch }}
          path: prebuilds/

  windows-tests:
    name: Windows Tests
    strategy:
      matrix:
        node: [24, 26]
        arch: [x64, arm64]
      fail-fast: false
    runs-on: windows-latest
    steps:
      - name: Setup Environment
        run: |
          git config --system core.autocrlf input
          git config --global core.autocrlf input
          git config --global user.name "John Doe"
          git config --global user.email johndoe@example.com

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: npm ci

      - name: Test
        # need arm64 runners or an emulator to run tests
        if: matrix.arch != 'arm64'
        env:
          GIT_SSH: ${{ github.workspace }}\vendor\plink.exe
        run: |
          $encodedKey = Get-Content -Path test\private.ppk.enc
          $finalPath = Join-Path -Path $HOME -ChildPath .ssh_tests\private.ppk
          mkdir ~\.ssh_tests
          Set-Content -Value $([System.Convert]::FromBase64String($encodedKey)) -Path $finalPath -AsByteStream
          powershell -command "Start-Process .\vendor\pageant\pageant_${{ matrix.arch }}.exe $finalPath"
          node utils/retry npm test

      # You're probably wondering why this isn't a single `run: |` step, it certainly is for *nix,
      # but it's not, because the CI runner for windows doesn't wait for each step as listed here
      # and it treats each additional step past the first as an orphaned process.
      - name: Test packed installation
        if: matrix.arch != 'arm64'
        run: npm run test:package

      - name: Prebuild
        env:
          npm_config_arch: ${{ matrix.arch }}
          PREBUILD_ARCH: ${{ matrix.arch }}
        run: npm run prebuild

      - name: Verify Windows prebuild architecture
        run: node utils/verifyWindowsPrebuilds.js ${{ matrix.arch }}

      - name: Test Electron runtimes
        if: matrix.node == 24 && matrix.arch == 'x64'
        run: npm run test:electron

      - name: Upload Prebuild Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-windows-${{ matrix.node }}-${{ matrix.arch }}
          path: prebuilds/
